<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1F1320">
<title>CronoHitos · Pinky Promise</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=JetBrains+Mono:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="tabbar">
  <button class="tab active" data-view="timer">⏱️ Cronómetro</button>
  <button class="tab" data-view="templates">📋 Plantillas</button>
  <button class="tab" data-view="history">📈 Historial</button>
</nav>

<main id="app">

  <!-- ===== VISTA CRONÓMETRO ===== -->
  <section id="view-timer" class="view active">

    <div id="setup-panel" class="panel">
      <h1 class="title">¿Qué toca hoy?</h1>
      <p class="subtitle">Elige una plantilla o crea los hitos al momento</p>

      <select id="template-picker" class="select">
        <option value="">— Sesión libre (sin plantilla) —</option>
      </select>

      <div id="milestone-editor" class="milestone-editor"></div>

      <button id="add-milestone-btn" class="btn btn-ghost">+ Añadir hito</button>

      <button id="start-btn" class="btn btn-primary btn-big">Empezar ▶</button>
    </div>

    <div id="run-panel" class="panel hidden">
      <div class="ring-wrap">
        <svg id="progress-ring" viewBox="0 0 220 220" class="ring">
          <circle class="ring-bg" cx="110" cy="110" r="96"></circle>
          <circle id="ring-fill" class="ring-fill" cx="110" cy="110" r="96"></circle>
        </svg>
        <div class="ring-center">
          <div id="elapsed-time" class="elapsed">00:00</div>
          <div id="current-milestone-name" class="milestone-name">—</div>
          <div id="remaining-label" class="remaining">objetivo: —</div>
        </div>
      </div>

      <div id="milestone-track" class="milestone-track"></div>

      <div class="controls">
        <button id="pause-btn" class="btn btn-secondary">⏸ Pausa</button>
        <button id="next-btn" class="btn btn-primary">Siguiente hito ✓</button>
      </div>
      <button id="finish-btn" class="btn btn-ghost btn-danger">Finalizar sesión</button>
    </div>

  </section>

  <!-- ===== VISTA PLANTILLAS ===== -->
  <section id="view-templates" class="view">
    <h1 class="title">Tus plantillas</h1>
    <p class="subtitle">Guarda combos de hitos que repites siempre</p>
    <div id="templates-list" class="list"></div>
    <button id="new-template-btn" class="btn btn-primary btn-big">+ Nueva plantilla</button>
  </section>

  <!-- ===== VISTA HISTORIAL ===== -->
  <section id="view-history" class="view">
    <h1 class="title">Historial</h1>
    <p class="subtitle">Cuánto tardas realmente vs lo previsto</p>
    <div id="history-list" class="list"></div>
  </section>

</main>

<div id="toast-container"></div>

<!-- plantilla oculta para editar hito -->
<template id="milestone-row-template">
  <div class="milestone-row">
    <input type="text" class="ms-name" placeholder="Nombre del hito (ej. Cutículas)">
    <input type="number" class="ms-duration" min="1" placeholder="min">
    <button class="ms-remove" title="Quitar">✕</button>
  </div>
</template>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
